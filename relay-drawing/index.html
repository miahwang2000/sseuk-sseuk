<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E3F4EC">
<title>그림 릴레이</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="student">

<section id="join" class="screen on">
  <div class="center">
    <h1 class="title">그림 릴레이</h1>
    <p class="sub">선생님 화면에 있는 방 번호를 입력해요</p>
    <label class="field">방 번호
      <input id="code" class="code-input" inputmode="numeric" maxlength="4" autocomplete="off">
    </label>
    <label class="field">이름
      <input id="name" maxlength="12" autocomplete="off">
    </label>
    <button id="joinBtn" class="btn primary big">수업 시작하기</button>
    <p id="joinMsg" class="msg" role="status"></p>
  </div>
</section>

<section id="lobby" class="screen">
  <div class="center">
    <p class="sub">들어왔어요!</p>
    <p class="me" id="meName"></p>
    <p class="sub">선생님이 시작할 때까지 기다려요</p>
    <p class="progress-text">지금 <span id="lobbyCount">0</span>명이 함께해요</p>
  </div>
</section>

<section id="watch" class="screen">
  <div class="center">
    <p class="me">이번 판은 구경해요</p>
    <p class="sub">다음 판에 함께해요!</p>
  </div>
</section>

<section id="peek" class="screen">
  <div class="peek">
    <p class="peek-title">잘 보고 기억해요!</p>
    <img id="peekImg" alt="앞 친구의 그림">
    <span class="timer">0</span>
  </div>
</section>

<section id="draw" class="screen">
  <header class="drawbar">
    <span class="chip" id="roundChip"></span>
    <span class="topic" id="topic"></span>
    <button id="prevBtn" class="btn small" hidden>앞 장면 보기</button>
    <span class="timer">0</span>
  </header>
  <div class="drawmain">
    <div class="padzone"><div class="pad" id="pad"></div></div>
    <div class="tools" id="tools"></div>
  </div>
</section>

<section id="wait" class="screen">
  <div class="center">
    <p class="me" id="waitMsg">그림을 냈어요!</p>
    <p class="sub">친구들을 기다리고 있어요</p>
    <p class="progress-text" id="waitCount"></p>
    <span class="timer">0</span>
  </div>
</section>

<section id="tv" class="screen">
  <div class="center">
    <p class="me">다 그렸어요!</p>
    <p class="sub">이제 선생님 화면을 함께 봐요</p>
  </div>
</section>

<section id="reveal" class="screen">
  <div class="feed" id="sFeed"></div>
</section>

<div id="prevView" class="overlay" hidden>
  <img id="prevImg" alt="앞 친구가 그린 장면">
  <p class="overlay-hint">눌러서 닫기</p>
</div>

<script type="module" src="js/student.js"></script>
</body>
</html>
