<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그림 릴레이 · 선생님</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="host">

<section id="home" class="screen on">
  <div class="center">
    <h1 class="title">그림 릴레이</h1>
    <p class="sub">선생님 진행 화면</p>
    <button id="newRoom" class="btn primary big">새 방 만들기</button>
    <p id="homeMsg" class="msg" role="status"></p>
  </div>
</section>

<section id="lobby" class="screen">
  <div class="lobby">
    <div class="lobby-main">
      <p class="sub">방 번호</p>
      <p class="bigcode" id="bigCode">----</p>
      <p class="addr">학생 주소 <b id="addr"></b></p>
      <p class="progress-text"><span id="pCount">0</span>명 들어왔어요</p>
      <div class="roster" id="lobbyRoster"></div>
    </div>
    <aside class="panel">
      <h2>게임 설정</h2>
      <div class="seg" role="radiogroup" aria-label="게임 방식">
        <label><input type="radio" name="mode" value="guess" checked>추측해서 그리기</label>
        <label><input type="radio" name="mode" value="story">이어그리기</label>
      </div>
      <p class="hint" id="modeHint"></p>
      <button id="editPrompts" class="btn"><span id="promptLabel">제시어</span> 편집 (<span id="promptCount">0</span>개)</button>
      <div class="row2">
        <label class="field">라운드<select id="rounds"></select></label>
        <label class="field">그리는 시간<select id="draw"></select></label>
      </div>
      <label class="field" id="peekField">앞 그림 보는 시간<select id="peek"></select></label>
      <label class="check" id="onionField"><input type="checkbox" id="onion">
        <span>앞 장면을 캔버스 뒤에 흐리게 깔기<small class="hint">애니메이션처럼 이어 그릴 때 좋아요</small></span>
      </label>
      <label class="check"><input type="checkbox" id="sync">
        <span>공개할 때 학생 화면에도 보여주기<small class="hint">데이터를 많이 써요. 핫스팟을 쓰는 날엔 꺼 두세요.</small></span>
      </label>
      <p class="hint">라운드는 학생 수보다 많게 정해도 학생 수만큼만 진행돼요.</p>
      <button id="startBtn" class="btn primary big">게임 시작</button>
      <p id="lobbyMsg" class="msg" role="status"></p>
      <button id="closeBtn1" class="btn small">방 닫기</button>
    </aside>
  </div>
</section>

<section id="play" class="screen">
  <div class="playhead">
    <span class="chip big" id="hRound"></span>
    <span class="timer big" id="hTimer">0</span>
    <span class="progress-text" id="hProg"></span>
    <span class="spacer"></span>
    <button id="plus30" class="btn">30초 더 주기</button>
    <button id="skipBtn" class="btn">다음 라운드로 넘기기</button>
  </div>
  <div class="roster play" id="playRoster"></div>
</section>

<section id="reveal" class="screen">
  <div class="reveal">
    <nav class="chains" id="chainList" aria-label="사슬 목록"></nav>
    <div class="feed" id="hFeed"></div>
  </div>
  <div class="revbar">
    <button id="rPrev" class="btn">이전</button>
    <button id="rNext" class="btn primary big">다음 그림</button>
    <button id="rAll" class="btn">이 사슬 모두 보기</button>
    <span id="viewSeg" class="viewseg" hidden>
      <button data-v="toon">웹툰</button><button data-v="anim">애니메이션</button>
    </span>
    <span class="spacer"></span>
    <button id="againBtn" class="btn">한 판 더</button>
    <button id="closeBtn2" class="btn danger">게임 끝내기</button>
  </div>
</section>

<div id="promptModal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="pmTitle">
    <h2 id="pmTitle">제시어 편집</h2>
    <p class="hint">한 줄에 하나씩 적어요. 이어그리기에서는 이야기 주제를 적어요. 학생 수보다 적으면 같은 제시어가 여러 사슬에 나와요.</p>
    <textarea id="promptText" spellcheck="false"></textarea>
    <div class="row2">
      <button id="pmCancel" class="btn">취소</button>
      <button id="pmSave" class="btn primary">저장</button>
    </div>
  </div>
</div>

<script type="module" src="js/host.js"></script>
</body>
</html>
