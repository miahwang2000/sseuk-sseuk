<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>쓱쓱그려요</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🖍️</text></svg>"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap');

:root{
  --bg-page:#16241f;
  --board:#2f4f43;
  --board-light:#3a5f51;
  --board-dark:#243f35;
  --wood:#8b5a3c;
  --wood-dark:#6e4630;
  --wood-light:#a3724f;
  --chalk:#f5f1e6;
  --chalk-dim:#c9d0c5;
  --yellow:#ffc93c;
  --coral:#ff6f59;
  --sky:#5dade2;
  --purple:#9b6bce;
  --correct:#6fcf97;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,0.03), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(255,255,255,0.03), transparent 40%),
    var(--bg-page);
  font-family:'Gaegu', sans-serif;
  color:var(--chalk);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

.app{
  width:100%;
  max-width:560px;
}

/* ---------- frame ---------- */
.frame{
  background:linear-gradient(180deg, var(--wood-light), var(--wood) 18%, var(--wood-dark));
  border-radius:22px;
  padding:14px;
  box-shadow:0 18px 40px rgba(0,0,0,0.45), inset 0 0 0 2px rgba(0,0,0,0.15);
}

.board{
  background:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,0.04), transparent 35%),
    radial-gradient(circle at 85% 75%, rgba(255,255,255,0.035), transparent 35%),
    var(--board);
  border-radius:14px;
  padding:20px;
  position:relative;
  outline:2px dashed rgba(245,241,230,0.18);
  outline-offset:-10px;
}

/* ---------- header ---------- */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
  flex-wrap:wrap;
  gap:10px;
}
.logo{
  font-family:'Jua', sans-serif;
  font-size:26px;
  color:var(--chalk);
  text-shadow:0 0 10px rgba(245,241,230,0.25);
  letter-spacing:0.5px;
}
.logo span{ color:var(--yellow); }

.dots{
  display:flex;
  gap:8px;
}
.dot{
  width:16px;height:16px;
  border-radius:50%;
  border:2px solid var(--chalk-dim);
  background:transparent;
  transition:transform .25s ease;
}
.dot.current{
  border-color:var(--yellow);
  box-shadow:0 0 0 3px rgba(255,201,60,0.18);
  transform:scale(1.15);
}
.dot.correct{ background:var(--correct); border-color:var(--correct); }
.dot.wrong{ background:var(--coral); border-color:var(--coral); }

/* ---------- screens ---------- */
.screen{ display:none; }
.screen.active{ display:block; }

/* ---------- start screen ---------- */
.start-wrap{ text-align:center; padding:30px 6px 10px; }
.chalk-illustration{ font-size:64px; margin-bottom:6px; }
.start-title{
  font-family:'Jua', sans-serif;

  font-size:24px;
  margin:6px 0 10px;
}
.start-desc{
  color:var(--chalk-dim);
  font-size:16px;
  line-height:1.6;
  margin-bottom:22px;
}
.btn{
  font-family:'Gaegu', sans-serif;
  font-weight:700;
  font-size:17px;
  border:none;
  border-radius:30px;
  padding:13px 26px;
  cursor:pointer;
  color:var(--board-dark);
  background:var(--chalk);
  box-shadow:0 4px 0 rgba(0,0,0,0.25);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{ transform:translateY(-2px); }
.btn:active{ transform:translateY(1px); box-shadow:0 1px 0 rgba(0,0,0,0.25); }
.btn:focus-visible{ outline:3px solid var(--yellow); outline-offset:2px; }
.btn-primary{ background:var(--yellow); }
.btn-ghost{
  background:transparent;
  color:var(--chalk);
  border:2px solid var(--chalk-dim);
  box-shadow:none;
}
.btn-ghost:active{ transform:translateY(1px); }
.btn[disabled]{ opacity:0.4; cursor:not-allowed; transform:none !important; }

.round-select{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:22px;
}
.round-btn{
  font-family:'Gaegu', sans-serif;
  font-weight:700;
  font-size:16px;
  background:rgba(245,241,230,0.08);
  border:2px solid var(--chalk-dim);
  color:var(--chalk);
  border-radius:20px;
  padding:9px 18px;
  cursor:pointer;
}
.round-btn:focus-visible{ outline:3px solid var(--yellow); outline-offset:2px; }
.round-btn.active{ background:var(--yellow); color:var(--board-dark); border-color:var(--yellow); }

/* ---------- play screen ---------- */
.prompt-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.word-badge{
  font-family:'Jua', sans-serif;
  font-size:20px;
  background:rgba(245,241,230,0.08);
  border:2px dashed var(--chalk-dim);
  border-radius:16px;
  padding:8px 16px;
}
.word-badge b{
  color:var(--yellow);
  font-size:24px;
  margin-left:4px;
}
.timer{
  position:relative;
  width:56px;height:56px;
  flex-shrink:0;
}
.timer svg{ transform:rotate(-90deg); }
.timer-bg{ fill:none; stroke:rgba(245,241,230,0.15); stroke-width:6; }
.timer-fg{
  fill:none; stroke:var(--sky); stroke-width:6; stroke-linecap:round;
  transition:stroke-dasharray .3s linear, stroke .3s ease;
}
.timer-num{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Jua', sans-serif; font-size:18px;
}

.canvas-wrap{
  position:relative;
  border-radius:10px;
  overflow:hidden;
  background:var(--board-dark);
  box-shadow:inset 0 0 0 2px rgba(245,241,230,0.12), inset 0 0 30px rgba(0,0,0,0.35);
  touch-action:none;
}
#drawCanvas{
  display:block;
  width:100%;
  height:auto;
  cursor:crosshair;
}
.canvas-hint{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(245,241,230,0.28);
  font-size:15px;
  pointer-events:none;
  text-align:center;
  padding:0 20px;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:14px;
  flex-wrap:wrap;
}
.tool-group{ display:flex; gap:8px; }
.icon-btn{
  font-family:'Gaegu', sans-serif;
  font-size:14px;
  background:rgba(245,241,230,0.08);
  border:2px solid var(--chalk-dim);
  color:var(--chalk);
  border-radius:20px;
  padding:9px 14px;
  cursor:pointer;
}
.icon-btn:focus-visible{ outline:3px solid var(--yellow); outline-offset:2px; }
.icon-btn.active{ background:var(--yellow); color:var(--board-dark); border-color:var(--yellow); }

/* ---------- overlay ---------- */
.overlay{
  position:absolute;
  inset:0;
  background:rgba(22,36,31,0.92);
  border-radius:14px;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
}
.overlay.active{ display:flex; }
.overlay-inner{ max-width:360px; }
.overlay-emoji{ font-size:46px; margin-bottom:8px; }
.overlay-title{ font-family:'Jua', sans-serif; font-size:22px; margin-bottom:8px; }
.overlay-sub{ color:var(--chalk-dim); font-size:15px; line-height:1.6; margin-bottom:18px; }
.overlay-sub b{ color:var(--yellow); }

.spinner{
  width:34px;height:34px;
  border-radius:50%;
  border:4px solid rgba(245,241,230,0.2);
  border-top-color:var(--yellow);
  margin:0 auto 14px;
  animation:spin 0.9s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- summary ---------- */
.summary-wrap{ text-align:center; padding:18px 4px; }
.summary-score{
  font-family:'Jua', sans-serif;
  font-size:42px;
  color:var(--yellow);
  margin:10px 0 4px;
}
.summary-dots{ display:flex; gap:10px; justify-content:center; margin:18px 0 26px; }
.summary-dots .dot{ width:20px; height:20px; }

.footer-note{
  text-align:center;
  color:var(--chalk-dim);
  font-size:13px;
  margin-top:14px;
  opacity:0.7;
}

/* ---------- 연출(effects) ---------- */
@keyframes popIn{
  0%{ transform:scale(.3) rotate(-12deg); opacity:0; }
  60%{ transform:scale(1.25) rotate(6deg); opacity:1; }
  100%{ transform:scale(1) rotate(0); }
}
@keyframes shake{
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-9px) rotate(-6deg); }
  40%{ transform:translateX(9px) rotate(6deg); }
  60%{ transform:translateX(-6px); }
  80%{ transform:translateX(6px); }
}
@keyframes dotPop{
  0%{ transform:scale(.2); }
  60%{ transform:scale(1.7); }
  100%{ transform:scale(1); }
}
@keyframes heartbeat{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.14); }
}
.overlay-emoji{ display:inline-block; }
.overlay-emoji.pop{ animation:popIn .55s ease-out; }
.overlay-emoji.shake{ animation:shake .6s ease-in-out; }
.dot.pop{ animation:dotPop .5s ease-out; }
.timer.low{ animation:heartbeat .5s ease-in-out infinite; }
.streak{ color:var(--coral); font-family:'Jua', sans-serif; font-size:17px; }
.confetti{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; }
/* 그룹퀴즈(20문제)용: 점이 한 줄에 들어가도록 작게 */
.dots.compact{ gap:4px; }
.dots.compact .dot{ width:10px; height:10px; border-width:2px; }
.summary-dots{ flex-wrap:wrap; }
.summary-dots.compact{ gap:6px; }
.summary-dots.compact .dot{ width:14px; height:14px; }
</style>
</head>
<body>

<div class="app">
  <div class="frame">
    <div class="board" id="board">

      <div class="header">
        <div class="logo">쓱쓱<span>그려요</span></div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <div class="dots" id="dots"></div>
          <div class="home-btn-wrapper">
            <a href="javascript:void(0)" id="btnExitGame" style="display: inline-block; padding: 8px 14px; background: rgba(245,241,230,0.08); border: 2px solid var(--chalk-dim); color: var(--chalk); border-radius: 20px; text-decoration: none; font-family: 'Gaegu', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer;">🏠 나가기</a>
          </div>
        </div>
      </div>

      <!-- 시작 화면 (접속하면 바로 이 화면) -->
      <div class="screen active" id="screen-start">
        <div class="start-wrap">
          <div class="chalk-illustration">🖍️</div>
          <div class="start-title">제시어를 보고 그림을 그려보세요!</div>
          <div class="start-desc">
            AI가 여러분이 그린 그림을 보고<br/>
            무엇을 그렸는지 맞혀볼게요.<br/>
            아래에서 문제 수를 선택하고 시작해요!
          </div>
          <div class="round-select" id="roundSelect">
            <button class="round-btn active" data-rounds="5">5문제</button>
            <button class="round-btn" data-rounds="10">10문제</button>
            <button class="round-btn" data-rounds="20" data-group="1">👥 그룹퀴즈</button>
          </div>
          <button class="btn btn-primary" id="btnStart">시작하기</button>
          <!-- 그룹퀴즈를 고르면 시작하기 대신 나타난다 -->
          <div id="groupPanel" style="display:none;">
            <div class="start-desc" id="groupDesc" style="margin-bottom:14px;">친구들과 함께 20문제에 도전해요!<br/>준비됐으면 <b style="color:var(--yellow)">시작</b>을 눌러요.</div>
            <div style="display:flex; gap:12px; justify-content:center;">
              <button class="btn btn-primary" id="btnGroupStart" disabled>시작</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 플레이 화면 -->
      <div class="screen" id="screen-play">
        <div class="prompt-row">
          <div class="word-badge">제시어: <b id="wordLabel">사과</b></div>
          <div class="timer">
            <svg viewBox="0 0 60 60" width="56" height="56">
              <circle class="timer-bg" cx="30" cy="30" r="26"></circle>
              <circle class="timer-fg" id="timerRing" cx="30" cy="30" r="26"></circle>
            </svg>
            <div class="timer-num" id="timerNum">20</div>
          </div>
        </div>

        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="drawCanvas" width="400" height="280"></canvas>
          <div class="canvas-hint" id="canvasHint">여기에 손가락이나 마우스로 그려보세요</div>

          <div class="overlay" id="overlayLoading">
            <div class="overlay-inner">
              <div class="spinner"></div>
              <div class="overlay-title">AI가 그림을 보고 있어요...</div>
            </div>
          </div>

          <div class="overlay" id="overlayResult">
            <div class="overlay-inner">
              <div class="overlay-emoji" id="resultEmoji">🎉</div>
              <div class="overlay-title" id="resultTitle">정답이에요!</div>
              <div class="overlay-sub" id="resultSub">AI가 본 그림: <b id="resultGuess">사과</b></div>
              <button class="btn btn-primary" id="btnNext">다음 문제 →</button>
            </div>
          </div>

        </div>

        <div class="toolbar">
          <div class="tool-group">
            <button class="icon-btn" id="btnClear">🧹 지우기</button>
            <button class="icon-btn" id="btnBrush">✏️ 얇게</button>
          </div>
          <button class="btn btn-primary" id="btnSubmit" disabled>제출하기</button>
        </div>
      </div>

      <!-- 결과 요약 화면 -->
      <div class="screen" id="screen-summary">
        <div class="summary-wrap">
          <div class="overlay-emoji" id="summaryEmoji">🏁</div>
          <div class="start-title" style="margin-bottom:0;">게임 완료!</div>
          <div class="summary-score"><span id="finalScore">0</span> / <span id="finalTotal">5</span></div>
          <div class="overlay-sub" id="summaryMsg" style="margin:0;"></div>
          <div class="summary-dots" id="summaryDots"></div>
          <button class="btn btn-primary" id="btnReplay">다시 하기</button>
        </div>
      </div>

    </div>
  </div>
  <div class="footer-note">AI가 이 기기 안에서 바로 그림을 알아봐요 (Quick, Draw! 데이터 기반)</div>
</div>

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function clearCanvas(){
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--board-dark') || '#243f35';

  function renderDots(){
    dotsEl.innerHTML = '';
    dotsEl.classList.toggle('compact', ROUNDS > 10);
    for (var i = 0; i < ROUNDS; i++){
      var d = document.createElement('div');
      d.className = 'dot';
      if (i < state.results.length){
        d.classList.add(state.results[i] === 'correct' ? 'correct' : 'wrong');
        if (i === state.popIndex) d.classList.add('pop'); // 연출: 방금 채점된 점이 톡 튄다
      } else if (i === state.roundIndex){
        d.classList.add('current');
      }
      dotsEl.appendChild(d);
    }
  }

  // ---------- drawing ----------
  function getPos(e){
    var rect = canvas.getBoundingClientRect();
    var clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
    var clientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  function startDraw(e){
    if (state.phase !== 'drawing') return; // 🔐 phase 체크
    state.drawing = true;
    var p = getPos(e);
    state.lastX = p.x; state.lastY = p.y;
    canvasHint.style.display = 'none';
    if (!state.hasDrawn){
      state.hasDrawn = true;
      btnSubmit.disabled = false;
    }
    e.preventDefault();
  }

  function moveDraw(e){
    if (!state.drawing || state.phase !== 'drawing') return; // 🔐 phase 체크 추가
    var p = getPos(e);
    ctx.strokeStyle = '#f5f1e6';
    ctx.lineWidth = state.lineWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(state.lastX, state.lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    state.lastX = p.x; state.lastY = p.y;
    e.preventDefault();
  }

  function endDraw(e){
    state.drawing = false;
  }

  canvas.addEventListener('pointerdown', startDraw);
  canvas.addEventListener('pointermove', moveDraw);
  window.addEventListener('pointerup', endDraw);

  function updateTimerDisplay(){
    timerNumEl.textContent = state.timeLeft;
    var ratio = Math.max(state.timeLeft, 0) / ROUND_SECONDS;
    var offset = RING_CIRC * (1 - ratio);
    timerRingEl.style.strokeDasharray = RING_CIRC + ' ' + RING_CIRC;
    timerRingEl.style.strokeDashoffset = offset;
    timerRingEl.style.stroke = state.timeLeft <= 5 ? 'var(--coral)' : 'var(--sky)';
    // 연출: 5초 이하면 타이머가 두근두근
    document.querySelector('.timer').classList.toggle('low', state.timeLeft <= 5 && state.timeLeft > 0);

  // 🔐 캔버스가 사실상 비어있는지 확인 (배경색과 거의 같은 픽셀 비율로 판단)
  // → 거의 안 그린 상태면 판독 자체를 생략하고 바로 안내한다.
  function isCanvasNearlyEmpty(){
    var w = canvas.width, h = canvas.height;
    var data = ctx.getImageData(0, 0, w, h).data;
    var bgR = 0x24, bgG = 0x3f, bgB = 0x35; // --board-dark
    var diffThreshold = 40;   // 배경색과의 색상 차이 임계값
    var sampleStep = 4;       // 4픽셀당 1개만 검사 (성능)
    var drawnCount = 0, sampledCount = 0;

    for (var i = 0; i < data.length; i += 4 * sampleStep){
      var diff = Math.abs(data[i] - bgR) + Math.abs(data[i+1] - bgG) + Math.abs(data[i+2] - bgB);
      if (diff > diffThreshold) drawnCount++;
      sampledCount++;
    }
    var drawnRatio = drawnCount / sampledCount;
    return drawnRatio < 0.003; // 0.3% 미만이면 '거의 빈 캔버스'로 간주
  }

  // ---------- 브라우저 내부 AI (Quick, Draw! CNN + TensorFlow.js) ----------
  // 모델: doodleNet (Quick, Draw! 345종 학습, 입력 28x28 흑백). 외부 AI 서버/API 키 없음.
  var MODEL_BASE = 'https://cdn.jsdelivr.net/gh/yining1023/doodleNet@master/model-tfjs/';
  var TOP_K_OK = 3;          // 상위 3개 안에 정답이 있으면 정답 (아이들 그림이라 관대하게)
  var MIN_THINK_MS = 1400;   // 연출용 "생각 중" 최소 시간
  var model = null, classNames = [], modelState = 'idle'; // idle | loading | ready | error

  function wait(ms){ return new Promise(function(resolve){ setTimeout(resolve, ms); }); }

  function loadModel(){
    if (modelState === 'loading' || modelState === 'ready') return Promise.resolve();
    modelState = 'loading';
    updateStartButton();
    if (typeof tf === 'undefined') { modelState = 'error'; updateStartButton(); return Promise.resolve(); }
    return Promise.all([
      tf.loadLayersModel(MODEL_BASE + 'model.json'),
      fetch(MODEL_BASE + 'class_names.txt').then(function(r){ return r.text(); })
    ]).then(function(res){
      model = res[0];
      classNames = res[1].split('\n').map(function(t){ return t.trim(); }).filter(Boolean);
      if (classNames.length !== 345) throw new Error('CLASS_MISMATCH');
      tf.tidy(function(){ model.predict(tf.zeros([1, 28, 28, 1])).dataSync(); }); // 첫 판독 지연 방지 워밍업
      modelState = 'ready';
    }).catch(function(){
      modelState = 'error';
    }).then(updateStartButton);
  }

  // 모델이 준비되기 전엔 시작 버튼을 잠시 비활성화
  function updateStartButton(){
    var b = document.getElementById('btnStart');
    if (modelState === 'ready'){ b.disabled = false; b.textContent = '시작하기'; }
    else if (modelState === 'error'){ b.disabled = false; b.textContent = '🔄 AI 다시 불러오기'; }
    else { b.disabled = true; b.textContent = '🧠 AI 준비 중...'; }
    updateGroupButtons();
  }

  // 그룹퀴즈: 들어가면 바로 준비 상태. AI 모델만 준비되면 시작 버튼이 켜진다
  function updateGroupButtons(){
    var st = document.getElementById('btnGroupStart');
    if (modelState === 'ready') st.textContent = '시작';
    else if (modelState === 'error') st.textContent = '🔄 AI 다시 불러오기';
    else st.textContent = '🧠 AI 준비 중...';

  // 캔버스 → 28x28 입력 텐서. 그림 영역만 잘라 정사각형으로 맞추고, 잉크=1 / 배경=0 으로 만든다.
  function getModelInput(){
    var w = canvas.width, h = canvas.height;
    var src = ctx.getImageData(0, 0, w, h).data;
    var bgR = 0x24, bgG = 0x3f, bgB = 0x35, TH = 40; // --board-dark 와 비교
    var mask = new Uint8Array(w * h);
    var minX = w, minY = h, maxX = -1, maxY = -1;
    for (var y = 0; y < h; y++){
      for (var x = 0; x < w; x++){
        var i = (y * w + x) * 4;
        var diff = Math.abs(src[i] - bgR) + Math.abs(src[i+1] - bgG) + Math.abs(src[i+2] - bgB);
        if (diff > TH){
          mask[y * w + x] = 1;
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return null;

    var bw = maxX - minX + 1, bh = maxY - minY + 1;
    var side = Math.max(bw, bh);
    var pad = Math.round(side * 0.12) + 4;
    var full = side + pad * 2;
    var ox = pad + Math.floor((side - bw) / 2), oy = pad + Math.floor((side - bh) / 2);

    // 잉크 마스크를 정사각형 버퍼에 옮긴다
    var ink = new Uint8Array(full * full);
    for (var yy = 0; yy < bh; yy++){
      for (var xx = 0; xx < bw; xx++){
        if (mask[(minY + yy) * w + (minX + xx)]) ink[(oy + yy) * full + (ox + xx)] = 1;
      }
    }
    // 선 굵기 보정: 학습 데이터는 선이 그림 크기의 약 4.5% 두께인데, 얇게(4px) 그리면 축소 후
    // 선이 거의 사라져 "rain"처럼 오인식된다 (실측). 부족한 두께만큼 팽창(dilate)시킨다.
    var rad = Math.max(0, Math.ceil((side * 0.045 - state.lineWidth) / 2));
    if (rad > 0){
      var tmpBuf = new Uint8Array(full * full);
      var yv, xv, d;
      for (yv = 0; yv < full; yv++){            // 가로 방향 팽창
        for (xv = 0; xv < full; xv++){
          if (ink[yv * full + xv]){
            for (d = Math.max(0, xv - rad); d <= Math.min(full - 1, xv + rad); d++) tmpBuf[yv * full + d] = 1;
          }
        }
      }
      ink = new Uint8Array(full * full);
      for (yv = 0; yv < full; yv++){            // 세로 방향 팽창
        for (xv = 0; xv < full; xv++){
          if (tmpBuf[yv * full + xv]){
            for (d = Math.max(0, yv - rad); d <= Math.min(full - 1, yv + rad); d++) ink[d * full + xv] = 1;
          }
        }
      }
    }

    var sq = document.createElement('canvas');
    sq.width = sq.height = full;
    var sctx = sq.getContext('2d');
    var img = sctx.createImageData(full, full);
    for (var k = 0; k < full * full; k++){
      var j = k * 4;
      img.data[j] = img.data[j+1] = img.data[j+2] = ink[k] ? 255 : 0;
      img.data[j+3] = 255;
    }
    sctx.putImageData(img, 0, 0);

    // 반씩 줄여가며 축소해야 가는 선이 사라지지 않는다 (한 번에 줄이면 선이 끊김)
    var cur = sq;
    while (cur.width >= 56){
      var half = document.createElement('canvas');
      half.width = half.height = Math.max(28, Math.floor(cur.width / 2));
      var hctx = half.getContext('2d');
      hctx.imageSmoothingQuality = 'high';
      hctx.drawImage(cur, 0, 0, half.width, half.height);
      cur = half;
    }
    var fin = document.createElement('canvas');
    fin.width = fin.height = 28;
    var fctx = fin.getContext('2d');
    fctx.imageSmoothingQuality = 'high';
    fctx.drawImage(cur, 0, 0, 28, 28);

    var px = fctx.getImageData(0, 0, 28, 28).data;
    var vals = new Float32Array(784), mx = 0;
    for (var n = 0; n < 784; n++){ vals[n] = px[n * 4] / 255; if (vals[n] > mx) mx = vals[n]; }
    if (mx <= 0) return null;
    // 가는 선은 축소하면 흐려지므로 최대값 기준으로 키우고 감마로 선을 또렷하게
    for (var m = 0; m < 784; m++) vals[m] = Math.pow(vals[m] / mx, GAMMA);
    return tf.tensor4d(vals, [1, 28, 28, 1]);
  }
  var GAMMA = 0.6;

  // 상위 5개 후보 [{name, p}] 반환
  function classifyDrawing(){
    return new Promise(function(resolve, reject){
      if (modelState !== 'ready') { reject(new Error('MODEL_NOT_READY')); return; }
      try {
        var input = getModelInput();
        if (!input) { reject(new Error('EMPTY')); return; }
        var out = model.predict(input);
        var p = out.dataSync();
        input.dispose(); out.dispose();
        var arr = Array.prototype.map.call(p, function(v, i){ return { name: classNames[i], p: v }; });
        arr.sort(function(a, b){ return b.p - a.p; });
        resolve(arr.slice(0, 5));
      } catch (e) { reject(e); }
    });
  }

  // 연출: 판독 중 문구를 돌려가며 보여줘서 AI가 고민하는 느낌을 준다
  function startThinkingText(){
    var el = overlayLoading.querySelector('.overlay-title');
    var msgs = ['AI가 그림을 보고 있어요...', '음... 이건 뭘까요? 🤔', '선을 따라가 보는 중... ✏️', '아하, 알 것 같아요! 💡'];
    var n = 0;
    el.textContent = msgs[0];
    var id = setInterval(function(){ n = (n + 1) % msgs.length; el.textContent = msgs[n]; }, 380);
    return function(){ clearInterval(id); el.textContent = msgs[0]; };
  }

  // 연출: 외부 라이브러리 없이 만든 색종이 폭죽
  function burstConfetti(parent, count){
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var r = parent.getBoundingClientRect();
    var c = document.createElement('canvas');
    c.className = 'confetti';
    c.width = Math.max(1, Math.round(r.width));
    c.height = Math.max(1, Math.round(r.height));
    parent.appendChild(c);
    var g = c.getContext('2d');
    var colors = ['#ffc93c', '#ff6f59', '#5dade2', '#9b6bce', '#6fcf97', '#f5f1e6'];
    var ps = [];
    for (var i = 0; i < count; i++){
      ps.push({
        x: c.width / 2, y: c.height * 0.45,
        vx: (Math.random() - 0.5) * 11, vy: -Math.random() * 10 - 3,
        s: 5 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
        col: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    var t0 = performance.now();
    function frame(now){
      var dt = now - t0;
      g.clearRect(0, 0, c.width, c.height);
      ps.forEach(function(p){
        p.vy += 0.28; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        g.save();
        g.translate(p.x, p.y); g.rotate(p.rot);
        g.globalAlpha = Math.max(0, 1 - dt / 1900);
        g.fillStyle = p.col;
        g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
        g.restore();
      });
      if (dt < 1900 && c.parentNode) requestAnimationFrame(frame); else c.remove();
    }
    requestAnimationFrame(frame);
  }

  // 🔐 submitOnce: 판독 단일 진입점 (중복 실행 방지)
  function submitOnce(trigger){
    if (state.phase !== 'drawing') return;   // drawing 상태에서만
    if (state.aiLock) return;                // 이미 판독 중이면 무시
    state.aiLock = true;

    state.phase = 'submitting';
    clearInterval(state.timerId);
    document.querySelector('.timer').classList.remove('low');
    btnSubmit.disabled = true;

    if (!state.hasDrawn){ recordResult(false, null, 'timeout'); return; }
    if (isCanvasNearlyEmpty()){ recordResult(false, null, 'empty'); return; }

    var target = state.words[state.roundIndex];
    var started = Date.now();
    var stopThinking = startThinkingText();
    overlayLoading.classList.add('active');

    classifyDrawing()
      .then(function(top){
        // 판독은 순식간이라 연출용으로 잠깐 더 기다린다
        return wait(Math.max(0, MIN_THINK_MS - (Date.now() - started))).then(function(){ return top; });
      })
      .then(function(top){
        stopThinking();
        overlayLoading.classList.remove('active');
        var ok = WORDS[target];
        var correct = top.slice(0, TOP_K_OK).some(function(t){ return ok.indexOf(t.name) !== -1; });
        recordResult(correct, top, null);
      })
      .catch(function(){
        stopThinking();
        overlayLoading.classList.remove('active');
        recordResult(false, null, 'error');
      });
  }

  document.getElementById('btnSubmit').addEventListener('click', function(){ submitOnce('button'); });

  // reason: null(정상 판정) | 'timeout' | 'empty' | 'error'
  function recordResult(correct, top, reason){
    state.results.push(correct ? 'correct' : 'wrong');
    if (correct) state.score += 1;
    state.popIndex = state.results.length - 1;
    renderDots();
    state.popIndex = -1;

    state.phase = 'result';
    state.retryUsed = false;

    var target = state.words[state.roundIndex];
    var streak = 0;
    for (var i = state.results.length - 1; i >= 0 && state.results[i] === 'correct'; i--) streak++;

    resultEmoji.textContent = correct ? (streak >= 3 ? '🔥' : '🎉') : (reason === 'error' ? '😵' : '🤔');
    resultTitle.textContent = correct
      ? '정답이에요!'
      : (reason === 'error' ? 'AI가 잠깐 졸고 있어요' : '다음엔 맞힐 수 있을 거예요!');

    if (reason === 'timeout'){
      resultSub.innerHTML = '시간이 끝났어요! 정답은 <b>' + target + '</b> 였어요.';
    } else if (reason === 'empty'){
      resultSub.innerHTML = '그림이 너무 적어요! 정답은 <b>' + target + '</b> 였어요.';
    } else if (reason === 'error'){
      resultSub.innerHTML = '그림을 읽지 못했어요.<br/>정답은 <b>' + target + '</b> 였어요.';
    } else if (correct){
      resultSub.innerHTML = 'AI가 알아챘어요: <b>' + target + '</b>'
        + (streak >= 2 ? '<br/><span class="streak">🔥 ' + streak + '연속 정답!</span>' : '');
    } else {
      resultSub.innerHTML = 'AI가 본 그림: <b>' + koreanOf(top[0].name) + '</b>'
        + '<br/>정답: <b>' + target + '</b>';
    }

    // 연출: 정답이면 이모지가 튀어나오고 폭죽, 오답이면 살짝 흔들림
    resultEmoji.classList.remove('pop', 'shake');
    void resultEmoji.offsetWidth; // 애니메이션 재시작
    resultEmoji.classList.add(correct ? 'pop' : 'shake');
    overlayResult.classList.add('active');
    if (correct) burstConfetti(overlayResult, streak >= 3 ? 130 : 70);
  }

  btnNext.addEventListener('click', function(){
    overlayResult.classList.remove('active');
    state.roundIndex += 1;
    if (state.roundIndex >= ROUNDS){
      showSummary();
    } else {
      startRound();
    }
  });

  function showSummary(){
    state.phase = 'summary';
    finalScoreEl.textContent = state.score;
    finalTotalEl.textContent = ROUNDS;
    summaryDotsEl.innerHTML = '';
    summaryDotsEl.classList.toggle('compact', ROUNDS > 10);
    state.results.forEach(function(r){
      var d = document.createElement('div');
      d.className = 'dot ' + (r === 'correct' ? 'correct' : 'wrong');
      summaryDotsEl.appendChild(d);
    });

    // 연출: 점수에 따라 이모지/멘트가 달라지고, 잘하면 폭죽
    var ratio = state.score / ROUNDS;
    var emojiEl = document.getElementById('summaryEmoji');
    var msgEl = document.getElementById('summaryMsg');
    emojiEl.textContent = ratio >= 0.8 ? '🏆' : (ratio >= 0.5 ? '🎉' : '💪');
    msgEl.textContent = ratio >= 0.8 ? '와! 그림 천재예요!' : (ratio >= 0.5 ? '정말 잘했어요!' : '연습하면 더 잘할 수 있어요!');
    emojiEl.classList.remove('pop'); void emojiEl.offsetWidth; emojiEl.classList.add('pop');

    showScreen('summary');
    if (ratio >= 0.5) burstConfetti(document.getElementById('board'), ratio >= 0.8 ? 160 : 90);
  }

  // 화면 전환: 하나만 active로 표시, 나가기 버튼은 플레이 화면에서만 노출
  function showScreen(name){
    Object.keys(screens).forEach(function(key){
      screens[key].classList.toggle('active', key === name);
    });
    var homeBtn = document.querySelector('.home-btn-wrapper');
    if (homeBtn) homeBtn.style.display = (name === 'play') ? 'block' : 'none';
  }

  // 게임 중 "나가기"를 누르면 문제 수 선택 화면으로 이동
  function exitToRoundSelect(){
    clearInterval(state.timerId);
    hideOverlays();
    state.phase = 'start';
    showScreen('start');
  }

  document.getElementById('btnExitGame').addEventListener('click', function(){
    exitToRoundSelect();
  });

  // 시작 화면에서 "시작하기"를 누르면 바로 게임 시작 (교실 코드 없이 접속 즉시 이용 가능)
  function startGame(){
    if (modelState !== 'ready'){ loadModel(); return; } // 오류 후 재시도
    newGame();
  }

  // ---------- start / restart ----------
  function newGame(){
    state.phase = 'playing'; // 🔐 게임 시작 상태
    state.words = shuffle(ALL_WORDS).slice(0, ROUNDS);
    state.roundIndex = 0;
    state.score = 0;
    state.results = [];
    showScreen('play');
    startRound();
  }

  roundButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      roundButtons.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      ROUNDS = parseInt(btn.getAttribute('data-rounds'), 10);
      isGroup = btn.getAttribute('data-group') === '1';
      showStartMode();
      updateGroupButtons();
    });
  });

  document.getElementById('btnStart').addEventListener('click', startGame);
  document.getElementById('btnGroupStart').addEventListener('click', startGame);
  document.getElementById('btnReplay').addEventListener('click', function(){
    exitToRoundSelect();
  });

  // initial paint
  updateStartButton();
  loadModel(); // 시작 화면에 머무는 동안 AI 모델을 미리 불러온다
  clearCanvas();
  renderDots();
  // 초기 상태: 나가기 버튼 숨김 (게임 화면에서만 표시)
  document.querySelector('.home-btn-wrapper').style.display = 'none';
})();
</script>
